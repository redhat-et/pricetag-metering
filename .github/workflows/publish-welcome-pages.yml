name: Publish welcome page

on:
  push:
    branches: [main]
    paths:
      - internal/dashboard/welcome.html
      - .github/workflows/publish-welcome-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render static welcome page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          sed 's|{{GATEWAY_URL}}|https://api.enmaas.devshift.net|g' \
            internal/dashboard/welcome.html > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
