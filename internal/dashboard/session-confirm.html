<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PriceTag — {{.Title}}</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#0b0e11;color:#e2e6ec;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
.session-card{width:min(480px,100%);padding:28px;background:#141820;border:1px solid #2e3848;border-radius:12px}
.logo{font-size:18px;font-weight:700}.logo em{font-style:normal;color:#4da0f8}h1{font-size:20px;margin:20px 0 16px}p{color:#8090a8;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}button,a{font:inherit;padding:9px 18px;border-radius:6px;text-decoration:none}button{border:0;background:#4da0f8;color:#0b0e11;font-weight:600;cursor:pointer}a{border:1px solid #2e3848;color:#e2e6ec}:focus-visible{outline:2px solid #4da0f8;outline-offset:3px}
</style></head><body><main class="session-card"><div class="logo">Price<em>Tag</em></div>
<h1>{{.Title}}</h1><p>{{.Description}}</p>
{{if .ReadOnly}}<p>Read-only: keys and settings cannot be changed while viewing as a user. This changes the dashboard view in all tabs sharing this browser session.</p>{{end}}
<form method="post" action="{{.Action}}"><div class="actions"><a href="/dashboard">Cancel</a><button type="submit">Continue</button></div></form>
</main></body></html>
