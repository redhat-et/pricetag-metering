<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnMaaS · Welcome</title>
<meta name="description" content="EnMaaS — engineering AI access with clear usage visibility.">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #enmaas-welcome .copy {
    position: absolute; right: 7px; top: 7px; border: 1px solid #527262; background: #1b3325;
    color: #d9eee0; border-radius: 5px; padding: 4px 8px; cursor: pointer;
    font: 11px "IBM Plex Mono", monospace; appearance: none;
  }
  #enmaas-welcome .copy.done { color: #77f0ac; }
  @media (prefers-reduced-motion: reduce) {
    #enmaas-welcome { scroll-behavior: auto; }
  }
</style>
</head>
<body>
{{ENMAAS_WELCOME}}
<script>
(function () {
  "use strict";
  var root = document.getElementById("enmaas-welcome");
  if (!root) return;

  root.querySelectorAll(".code").forEach(function (code) {
    var pre = code.querySelector("pre");
    if (!pre || code.querySelector(".copy")) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.textContent = "copy";
    btn.addEventListener("click", function () {
      function done() {
        btn.textContent = "copied";
        btn.classList.add("done");
        setTimeout(function () {
          btn.textContent = "copy";
          btn.classList.remove("done");
        }, 1300);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(pre.innerText).then(done, function () {});
      }
    });
    code.appendChild(btn);
  });

  function postHeight() {
    parent.postMessage({ type: "enmaas-welcome-height", height: document.documentElement.scrollHeight }, "*");
  }
  addEventListener("load", postHeight);
  if ("ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.documentElement);
})();
</script>
</body>
</html>
